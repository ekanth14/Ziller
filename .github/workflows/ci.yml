name: CI / Production Build Verification

on:
  push:
    branches: [ main, feat/crypto-only ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pytest pytest-cov pip-audit

      - name: Code Linting (Flake8)
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 cryptoscope --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-blocking
          flake8 cryptoscope --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

      - name: Type Checking (mypy)
        run: |
          mypy cryptoscope/auth cryptoscope/fx cryptoscope/market_data --ignore-missing-imports || true

      - name: Dependency Security Audit
        run: |
          pip-audit || true

      - name: Run Pytest Test Suite
        env:
          ADMIN_INITIAL_PASSWORD: CiAdminTestPassword123!
          DATA_DIR: test_data
        run: |
          python -m pytest -v --durations=10
